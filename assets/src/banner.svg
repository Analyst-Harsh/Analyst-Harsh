<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="HG-01 datasheet: Harshit Goyal, full-stack AI developer, India. Speech envelope of Fryday's voice; voice-to-voice latency ~2.8 s as heard.">
<style>
/*FONTS*/
/*SERIF*/
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;font-weight:800}
.m{font-family:'IBM Plex Mono',Menlo,ui-monospace,monospace}
.s{font-family:'Instrument Serif',Georgia,serif;font-style:italic}
.ink{fill:var(--ink)} .mut{fill:var(--mut)} .acc{fill:var(--acc)}
.rl{stroke:var(--rule);fill:none}
.b0{fill:var(--rule)} .b1{fill:var(--h1)} .b2{fill:var(--h2)} .b3{fill:var(--h3)}
/* playhead crosses the 2.8 s window in 2.8 s; at rest it sits at the end */
.ph{animation:ph 2.8s linear infinite}
@keyframes ph{from{transform:translateX(-492px)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.ph{animation:none}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--h1)"/><stop offset=".5" stop-color="var(--h2)"/><stop offset="1" stop-color="var(--h3)"/></linearGradient></defs>
