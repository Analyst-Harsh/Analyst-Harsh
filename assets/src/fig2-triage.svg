<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img" aria-label="Fig. 2, Triage-Bot pipeline: plan, research, draft, risk check, then auto-post or wait in a human approval queue. 6 OWASP LLM Top 10 prompt-injection regression cases.">
<style>
/*FONTS*/
.d{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;font-weight:800}
.m{font-family:'IBM Plex Mono',Menlo,ui-monospace,monospace}
.ink{fill:var(--ink)} .mut{fill:var(--mut)} .acc{fill:var(--acc)}
.rl{stroke:var(--rule);fill:none}
.box{fill:var(--card);stroke:var(--rule);stroke-width:1.5}
/* two issues: one auto-posts, one waits ~1.5 s at the approval queue; at rest both sit at their end */
.dA{animation:dA 4s linear infinite}
.dB{animation:dB 4s linear infinite;animation-delay:-2s}
@keyframes dA{0%{transform:translate(296px,128px);opacity:1}45%{transform:translate(650px,128px)}52%{transform:translate(650px,97px)}60%,75%{transform:translate(700px,97px);opacity:1}80%,100%{transform:translate(700px,97px);opacity:0}}
@keyframes dB{0%{transform:translate(296px,128px);opacity:1}40%{transform:translate(650px,128px)}50%{transform:translate(650px,177px)}58%,95%{transform:translate(700px,177px);opacity:1}100%{transform:translate(700px,177px);opacity:0}}
@media (prefers-reduced-motion:reduce){.dA,.dB{animation:none}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--h1)"/><stop offset=".5" stop-color="var(--h2)"/><stop offset="1" stop-color="var(--h3)"/></linearGradient></defs>
<rect x=".5" y=".5" width="839" height="219" rx="12" fill="var(--card)" stroke="var(--rule)"/>
<text class="m acc" x="24" y="30" font-size="11" letter-spacing="1.5" font-weight="500">FIG 2 · ISSUE → JUDGMENT</text>
<text class="m mut" x="816" y="30" font-size="11" letter-spacing="1.5" text-anchor="end">HG-01-A</text>
<line class="rl" x1="0" y1="44" x2="840" y2="44"/>
<text class="d ink" x="22" y="102" font-size="44" letter-spacing=".5">TRIAGE-BOT</text>
<text class="d" x="22" y="156" font-size="40" fill="url(#g)">6</text>
<text class="m mut" x="24" y="180" font-size="10" letter-spacing="1">OWASP INJECTION CASES</text>
<text class="m mut" x="24" y="196" font-size="10" letter-spacing="1">REGRESSION-TESTED</text>
<line class="rl" x1="262.5" y1="62" x2="262.5" y2="200"/>
<path class="rl" d="M296 128H650M650 128V97H700M650 128V177H700" stroke-width="1.5"/>
<g class="m" font-size="10" text-anchor="middle" letter-spacing="1">
<rect class="box" x="296" y="113" width="60" height="30" rx="3"/><text class="ink" x="326" y="132">PLAN</text>
<rect class="box" x="380" y="113" width="60" height="30" rx="3"/><text class="ink" x="410" y="132">RSRCH</text>
<rect class="box" x="464" y="113" width="60" height="30" rx="3"/><text class="ink" x="494" y="132">DRAFT</text>
<rect x="548" y="113" width="60" height="30" rx="3" fill="var(--card)" stroke="url(#g)" stroke-width="2.5"/><text class="ink" x="578" y="132">RISK</text>
<rect class="box" x="700" y="82" width="104" height="30" rx="3"/><text class="ink" x="752" y="101">AUTO-POST</text>
<rect x="700" y="162" width="104" height="30" rx="3" fill="var(--card)" stroke="var(--acc)" stroke-width="1.5"/><text class="acc" x="752" y="181">APPROVAL</text>
</g>
<text class="m mut" x="752" y="207" font-size="9" text-anchor="middle">waits for a human</text>
<circle class="dA" r="4.5" fill="var(--h3)" transform="translate(700 97)"/>
<circle class="dB" r="4.5" fill="var(--h1)" transform="translate(700 177)"/>
</svg>
